[package]
name = "sqlinsts"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# A dummy lib is required to let Bazel generate BUILD files from a Cargo.toml file.
[lib]
path = "src/lib.rs"

[build-dependencies]
prost-build = "0.13"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bazel_build)'] }

[dependencies]
prost = "0.13"
bytes = "1.5"
tonic = "0.14.6"
