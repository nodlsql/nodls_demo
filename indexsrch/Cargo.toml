[package]
name = "indexsrch"
version = "0.1.0"
edition = "2021"
publish = false

# A dummy lib is required to let Bazel generate BUILD files from a Cargo.toml file.
[lib]
path = "src/lib.rs"

[dependencies]
capnp = "0.25"
sqlinsts = { version = "0.1.0", path = "../sqlinsts" }
indexkey = { version = "0.1.0", path = "../indexkey" }
tracing = "0.1.44"
rust_decimal = { version = "1.41.0", features = ["macros"] }
